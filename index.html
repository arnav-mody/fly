<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mody-Gandhi Travel Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300..700;1,300..700&family=Figtree:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    /* ───────────────────────────────────────────────────────────────────────
       MODY-GANDHI TRAVEL TRACKER
       ── Tokens
       Warm cream paper, deep ink, saffron accent. Sky-blue and sage are
       reserved for status (airborne / landed) and don't change with theme.
       ─────────────────────────────────────────────────────────────────────── */
    :root {
      --paper:        #f4ecdc;
      --paper-soft:   #ede4d0;
      --paper-deeper: #e3d8be;
      --paper-line:   rgba(28, 24, 20, .12);
      --ink:          #1e1812;
      --ink-soft:     #4a3f33;
      --ink-faint:    #7a6e60;
      --accent:       #c45a2a;
      --sky:          oklch(58% 0.13 240);
      --sage:         oklch(58% 0.11 145);
      --warn:         oklch(70% 0.17 60);

      --font-serif: "Fraunces", "Iowan Old Style", Georgia, serif;
      --font-sans:  "Figtree", ui-sans-serif, sans-serif;
      --font-mono:  "Space Mono", ui-monospace, "SF Mono", Menlo, monospace;

      --font-scale: 1;
      --radius:     14px;
      --shadow-1:   0 1px 0 rgba(28,24,20,.05), 0 1px 3px rgba(28,24,20,.05);
      --shadow-2:   0 1px 0 rgba(28,24,20,.05), 0 14px 32px -8px rgba(28,24,20,.18);

      --pad-rail:   28px;
      --gap-card:   16px;
    }
    :root[data-density="cozy"]   { --pad-rail: 20px; --gap-card: 12px; }
    :root[data-density="roomy"]  { --pad-rail: 44px; --gap-card: 22px; }
    :root[data-grandpa="1"]      { --font-scale: 1.18; }
    :root[data-dark="1"]         { --shadow-1: 0 1px 0 rgba(0,0,0,.4); --shadow-2: 0 1px 0 rgba(0,0,0,.4), 0 14px 32px -8px rgba(0,0,0,.55); }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { font-size: calc(16px * var(--font-scale)); }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      font-weight: 450;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
    }
    /* Warm paper texture — very subtle dot grain */
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(28,24,20,.04) 1px, transparent 1.5px);
      background-size: 4px 4px;
      mix-blend-mode: multiply;
    }
    :root[data-dark="1"] body::before { mix-blend-mode: screen; opacity: 0.5; }

    button { font-family: inherit; cursor: pointer; }
    h1, h2, h3 { margin: 0; }

    /* ───────────────────────────────────────────────────────────────────────
       App shell
       ─────────────────────────────────────────────────────────────────────── */
    .app { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    /* ── Top bar ──────────────────────────────────────────────────────────── */
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      padding: 20px 36px;
      border-bottom: 0.5px solid var(--paper-line);
      background: color-mix(in oklab, var(--paper) 92%, transparent);
      backdrop-filter: blur(16px);
      position: sticky; top: 0; z-index: 50;
    }
    .topbar__brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 44px; height: 44px; overflow: visible; }

    /* ── Living brand mark ─────────────────────────────────────────────── */
    .brand-mark__ring { transform-origin: 20px 20px; animation: brandSpin 26s linear infinite; }
    .brand-mark__plane { transform-origin: 20px 20px; animation: brandBob 3.2s ease-in-out infinite; }
    .brand-mark__spark { transform-origin: 34px 11px; animation: brandTwinkle 2.6s ease-in-out infinite; }
    @keyframes brandSpin { to { transform: rotate(360deg); } }
    @keyframes brandBob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-1.3px) rotate(-2deg); }
    }
    @keyframes brandTwinkle {
      0%, 100% { opacity: 0.55; transform: scale(0.85); }
      50%      { opacity: 1;    transform: scale(1.1); }
    }
    .topbar__brand:hover .brand-mark__plane,
    .footer__brand:hover .brand-mark__plane {
      animation: brandSwoop 700ms ease;
    }
    @keyframes brandSwoop {
      0%   { transform: translateY(0) rotate(0deg); }
      35%  { transform: translateY(-4px) rotate(-16deg); }
      70%  { transform: translateY(1px) rotate(6deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .brand-mark__ring, .brand-mark__plane, .brand-mark__spark { animation: none; }
    }
    .topbar__brand-text { line-height: 1; }
    .topbar__brand-title {
      font-family: var(--font-serif); font-size: 1.55rem; letter-spacing: -0.01em;
    }
    .topbar__brand-sub {
      font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--ink-faint); margin-top: 4px;
    }

    .topbar__nav { display: flex; gap: 4px; justify-content: center; }
    .topbar__nav button {
      appearance: none; background: transparent; border: 0;
      padding: 10px 18px; border-radius: 999px;
      color: var(--ink-soft); font-size: 0.9rem; font-weight: 500;
      transition: background .15s, color .15s;
    }
    .topbar__nav button:hover { background: var(--paper-soft); color: var(--ink); }
    .topbar__nav button[data-active="true"] {
      background: var(--ink); color: var(--paper);
    }

    .topbar__right { display: flex; align-items: center; gap: 14px; justify-content: flex-end; }
    .topbar__pulse {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.06em;
      color: var(--ink-soft); text-transform: uppercase;
    }
    .topbar__pulse-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint);
    }
    .topbar__pulse-dot[data-on="1"] {
      background: var(--sky); box-shadow: 0 0 0 0 var(--sky);
      animation: pulse 2.2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 color-mix(in oklab, var(--sky) 60%, transparent); }
      70%  { box-shadow: 0 0 0 10px color-mix(in oklab, var(--sky) 0%, transparent); }
      100% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--sky) 0%, transparent); }
    }

    .topbar__add {
      appearance: none; border: 0; width: 42px; height: 42px; flex: none; padding: 0; border-radius: 999px;
      background: var(--accent); color: white; font-weight: 600; font-size: 1.35rem; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      box-shadow: var(--shadow-1);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .topbar__add:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); }

    /* ── People filter (collapsed multi-select) ─────────────────────────── */
    .pfil { position: relative; }
    .pfil__btn { appearance: none; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--paper-line); background: var(--paper-soft); color: var(--ink-soft); font: inherit; font-size: 0.86rem; cursor: pointer; }
    .pfil__btn:hover { background: var(--paper-deeper); }
    .pfil__btn[data-on="1"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .pfil__caret { font-size: 0.7rem; opacity: 0.7; }
    .pfil__menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 60; width: 250px; background: var(--paper); border: 1px solid var(--paper-line); border-radius: 12px; box-shadow: var(--shadow-2); overflow: hidden; }
    .pfil__all { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--paper-line); padding: 12px 14px; font: inherit; font-size: 0.86rem; color: var(--ink); cursor: pointer; }
    .pfil__all:hover { background: var(--paper-soft); }
    .pfil__list { max-height: 46vh; overflow-y: auto; padding: 6px; }
    .pfil__item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
    .pfil__item:hover { background: var(--paper-soft); }
    .pfil__item input { position: absolute; opacity: 0; pointer-events: none; }
    .pfil__box { width: 17px; height: 17px; flex: none; border-radius: 4px; border: 1.5px solid var(--paper-line); }
    .pfil__item[data-on="1"] .pfil__box { background: var(--accent); border-color: var(--accent); position: relative; }
    .pfil__item[data-on="1"] .pfil__box::after { content: ""; position: absolute; left: 4.5px; top: 1.5px; width: 5px; height: 9px; border: 2px solid #fff; border-top: 0; border-left: 0; transform: rotate(40deg); }
    .pfil__name { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    @media (max-width: 1100px) {
      .topbar__pulse { display: none; }
      .topbar__brand-text { display: none; }
    }

    /* ── Person filter ──────────────────────────────────────────────────── */
    .pfilter {
      display: flex; gap: 8px; padding: 16px 36px;
      overflow-x: auto; scrollbar-width: thin;
      border-bottom: 0.5px solid var(--paper-line);
    }
    .pfilter::-webkit-scrollbar { height: 4px; }
    .pfilter::-webkit-scrollbar-thumb { background: var(--paper-deeper); border-radius: 2px; }
    .pfilter__chip {
      appearance: none; border: 0.5px solid var(--paper-line);
      background: var(--paper-soft); color: var(--ink-soft);
      padding: 6px 12px 6px 6px; border-radius: 999px;
      display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0;
      font-size: 0.82rem; font-weight: 500;
      transition: all .15s;
    }
    .pfilter__chip:hover { background: var(--paper-deeper); }
    .pfilter__chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .pfilter__chip:first-child { padding-left: 14px; }

    /* ── Main + Rails ───────────────────────────────────────────────────── */
    .main { flex: 1; padding: 28px 36px 80px; }
    .board { display: flex; flex-direction: column; gap: 52px; }
    .rail { display: flex; flex-direction: column; gap: 20px; }
    .rail__grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: var(--gap-card);
    }
    .rail--landed .rail__grid { opacity: 0.9; }

    /* ── Section header ─────────────────────────────────────────────────── */
    .sect-head { display: flex; flex-direction: column; gap: 4px; }
    .sect-head__kicker {
      font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--accent);
    }
    .sect-head__title {
      font-family: var(--font-serif); font-size: 2.2rem; letter-spacing: -0.015em;
      font-weight: 400; line-height: 1.1;
      display: inline-flex; align-items: baseline; gap: 14px;
    }
    .sect-head__count {
      font-family: var(--font-mono); font-size: 0.85rem; color: var(--ink-faint);
      font-weight: 400;
    }
    .sect-head__sub {
      font-size: 0.95rem; color: var(--ink-soft); margin-top: 2px;
    }

    /* ── HERO (Airborne) ────────────────────────────────────────────────── */
    .hero {
      position: relative;
      background: var(--paper-soft);
      border: 0.5px solid var(--paper-line);
      border-radius: 24px;
      padding: 32px 36px 28px;
      overflow: hidden;
      box-shadow: var(--shadow-2);
    }
    .hero--air::before {
      content: ""; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 80% at 100% 0%, color-mix(in oklab, var(--sky) 18%, transparent), transparent 60%),
        radial-gradient(ellipse 50% 60% at 0% 100%, color-mix(in oklab, var(--accent) 12%, transparent), transparent 60%);
      pointer-events: none;
    }
    .hero__pulse {
      position: absolute; top: -100px; right: -100px;
      width: 320px; height: 320px; border-radius: 50%;
      background: radial-gradient(circle, color-mix(in oklab, var(--sky) 28%, transparent), transparent 60%);
      animation: heroPulse 4s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes heroPulse {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50%      { transform: scale(1.1); opacity: 1; }
    }
    .hero__top {
      position: relative; display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .hero__kicker {
      font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ink-soft);
      display: inline-flex; align-items: center; gap: 8px;
    }
    .hero__live-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--sky);
      box-shadow: 0 0 0 0 var(--sky);
      animation: pulse 1.6s infinite;
    }
    .hero__live-dot--soon { background: var(--warn); }
    .hero__chip {
      font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 6px 12px; border-radius: 999px;
      background: var(--sky); color: white;
    }
    .hero__chip--soon { background: var(--warn); color: var(--ink); }

    .hero__layout {
      position: relative;
      display: grid; grid-template-columns: 1fr 1.15fr; gap: 36px; align-items: center;
    }
    @media (max-width: 980px) {
      .hero__layout { grid-template-columns: 1fr; }
    }
    .hero__left { display: flex; flex-direction: column; gap: 18px; }
    .hero__headline {
      font-family: var(--font-serif); font-size: clamp(2.4rem, 4.5vw, 4.2rem);
      font-weight: 400; line-height: 1; letter-spacing: -0.02em;
      text-wrap: balance;
    }
    .hero__name { font-style: italic; color: var(--accent); }
    .hero__verb { color: var(--ink); }
    .hero__sub {
      font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-soft);
      margin: 0; letter-spacing: 0.02em;
    }
    .hero__lines {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
      padding-top: 16px; border-top: 0.5px solid var(--paper-line);
    }
    .hero__line-lbl {
      font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--ink-faint);
    }
    .hero__line-val {
      font-family: var(--font-serif); font-size: 1.55rem; letter-spacing: -0.01em;
      margin-top: 2px;
    }
    .hero__more {
      align-self: flex-start; margin-top: 8px;
      appearance: none; border: 0; background: transparent;
      color: var(--ink); font-weight: 600; font-size: 0.9rem;
      padding: 8px 0; border-bottom: 1.5px solid var(--ink);
    }
    .hero__more:hover { color: var(--accent); border-color: var(--accent); }
    .hero__right { position: relative; }
    .hero__right .route-map {
      width: 100%; height: auto; aspect-ratio: 7/3;
      border-radius: 18px; overflow: hidden;
      background: var(--paper); border: 0.5px solid var(--paper-line);
    }
    .hero__note {
      position: relative; margin-top: 24px; padding: 18px 22px;
      border-left: 3px solid var(--accent);
      background: color-mix(in oklab, var(--paper) 70%, transparent);
      border-radius: 0 12px 12px 0;
      font-family: var(--font-serif); font-style: italic; font-size: 1.2rem;
      color: var(--ink-soft);
      display: flex; flex-direction: column; gap: 6px;
    }
    .hero__note-kicker {
      font-family: var(--font-mono); font-style: normal; font-size: 0.65rem;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
    }

    /* ── Route map shared bits ──────────────────────────────────────────── */
    .route-map { display: block; }
    .route-map__code {
      font-family: var(--font-mono); font-size: 11px; font-weight: 600;
      letter-spacing: 0.08em; fill: var(--ink);
    }
    .route-map__plane { transition: transform .8s ease; }

    /* ── Flight card ────────────────────────────────────────────────────── */
    .card {
      appearance: none; text-align: left; cursor: pointer;
      background: var(--paper-soft); border: 0.5px solid var(--paper-line);
      border-radius: var(--radius); padding: 18px;
      display: flex; flex-direction: column; gap: 14px;
      box-shadow: var(--shadow-1);
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s;
      color: inherit; font: inherit;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-2);
      border-color: var(--ink-faint);
    }
    .card--airborne { background:
      linear-gradient(135deg, color-mix(in oklab, var(--sky) 10%, var(--paper-soft)), var(--paper-soft));
    }
    .card--boarding { background:
      linear-gradient(135deg, color-mix(in oklab, var(--warn) 12%, var(--paper-soft)), var(--paper-soft));
    }
    .card--landed { background:
      linear-gradient(135deg, color-mix(in oklab, var(--sage) 12%, var(--paper-soft)), var(--paper-soft));
    }
    .card__top { display: flex; justify-content: space-between; align-items: center; }
    .card__lead {
      font-family: var(--font-serif); font-size: 1.4rem; line-height: 1.15;
      letter-spacing: -0.01em; text-wrap: balance;
    }
    .card__lead-name { font-style: italic; color: var(--accent); }
    .card__lead-verb { color: var(--ink); }
    .card__lead-time { color: var(--ink); font-weight: 500; }
    .card__cities {
      display: grid; grid-template-columns: auto 1fr auto;
      align-items: center; gap: 12px;
    }
    .card__city { display: flex; flex-direction: column; }
    .card__city:last-child { text-align: right; }
    .card__city-code {
      font-family: var(--font-mono); font-size: 1.05rem; font-weight: 600;
      letter-spacing: 0.04em;
    }
    .card__city-name {
      font-size: 0.72rem; color: var(--ink-faint); text-transform: uppercase;
      letter-spacing: 0.06em; margin-top: 2px;
    }
    .route-ribbon { width: 100%; height: 60px; }
    .card__note {
      font-family: var(--font-serif); font-style: italic; color: var(--ink-soft);
      font-size: 0.95rem; line-height: 1.4;
      padding-top: 12px; border-top: 0.5px dashed var(--paper-line);
    }

    /* ── FlightAware link (shared across cards/modal) ─────────────────────── */
    .fa-link {
      display: inline-flex; align-items: center; gap: 4px; align-self: flex-start;
      font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.02em;
      color: var(--ink-faint); text-decoration: none;
      border-bottom: 0.5px dashed var(--ink-faint); padding-bottom: 1px;
      transition: color .15s, border-color .15s, transform .15s;
    }
    .fa-link:hover { color: var(--accent); border-color: var(--accent); transform: translateX(1px); }
    .fa-link__arrow { transition: transform .15s; }
    .fa-link:hover .fa-link__arrow { transform: translate(1px, -1px); }
    .card__fa { margin-top: -2px; }
    .tcard__fa { margin-top: 2px; }
    .nowrow__fa { align-self: flex-start; }
    .fd__fa { margin-top: 14px; }

    /* ── Avatar ─────────────────────────────────────────────────────────── */
    .avatar {
      border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      font-family: var(--font-serif); font-weight: 500; letter-spacing: -0.02em;
      flex-shrink: 0; border: 1.5px solid var(--paper);
    }
    .avatar[data-ring="1"] { box-shadow: 0 0 0 2px var(--accent); }
    .avatar-stack { display: inline-flex; }
    .avatar-stack .avatar:not(:first-child) { margin-left: calc(var(--av-size) * -0.3); }

    /* ── Status pills ───────────────────────────────────────────────────── */
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--font-mono); font-size: 0.65rem;
      letter-spacing: 0.1em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px;
      background: var(--paper-deeper); color: var(--ink-soft);
    }
    .pill__dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill--air     { background: var(--sky);  color: white; }
    .pill--soon    { background: var(--warn); color: var(--ink); }
    .pill--landed  { background: var(--sage); color: white; }
    .pill--up      { background: var(--paper-deeper); color: var(--ink-soft); }
    .pill--past    { background: transparent; color: var(--ink-faint); border: 0.5px solid var(--paper-line); }
    .pill--air .pill__dot, .pill--landed .pill__dot { background: white; }

    /* ── Countdown ──────────────────────────────────────────────────────── */
    .countdown { display: flex; flex-direction: column; gap: 8px; }
    .countdown__label {
      font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--ink-faint);
    }
    .countdown__digits {
      display: inline-flex; align-items: baseline; gap: 4px;
      font-family: var(--font-mono); letter-spacing: -0.01em;
      font-size: 2.2rem;
    }
    .countdown--big .countdown__digits { font-size: clamp(2.8rem, 6vw, 4.6rem); }
    .cd-unit { display: inline-flex; align-items: baseline; gap: 0.14em; perspective: 300px; }
    .cd-num { display: inline-flex; gap: 0.06em; font-variant-numeric: tabular-nums; }
    /* Split-flap board tile — each digit remounts (new React key) whenever its
       value changes, which replays this animation. No JS timers needed. */
    .cd-flap {
      position: relative; display: inline-block; min-width: 0.68em;
      padding: 0.02em 0.09em; text-align: center; border-radius: 0.12em;
      background: var(--ink); color: var(--paper); box-shadow: var(--shadow-1);
      animation: cdFlap .5s cubic-bezier(.3,.7,.3,1);
    }
    .cd-flap::after {
      content: ""; position: absolute; left: 0.08em; right: 0.08em; top: calc(50% - 0.5px);
      height: 1px; background: color-mix(in oklab, var(--paper) 35%, transparent);
    }
    @keyframes cdFlap {
      0%   { transform: rotateX(-100deg); opacity: .25; }
      55%  { transform: rotateX(14deg); opacity: 1; }
      100% { transform: rotateX(0deg); }
    }
    .cd-u {
      font-family: var(--font-mono); font-size: 0.4em; color: var(--ink-faint);
      letter-spacing: 0.1em; text-transform: uppercase;
    }
    .cd-sep { color: var(--ink-faint); opacity: 0.4; }
    .countdown__neg { font-size: 0.8rem; color: var(--warn); }
    @media (prefers-reduced-motion: reduce) {
      .cd-flap { animation: none; }
    }

    /* ── Flight progress (in-flight bar) ────────────────────────────────── */
    .fprog { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .fprog__rail {
      position: relative; height: 4px; background: var(--paper-deeper);
      border-radius: 999px; overflow: visible;
    }
    .fprog__fill {
      position: absolute; top: 0; left: 0; height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--sky));
      transition: width 1s ease;
    }
    .fprog__plane {
      position: absolute; top: 50%; transform: translate(-50%, -50%);
      font-size: 1.1rem; color: var(--ink);
      transition: left 1s ease;
    }
    .fprog__times {
      display: flex; justify-content: space-between;
      font-family: var(--font-mono); font-size: 0.72rem;
      color: var(--ink-soft);
    }
    .fprog__remain { color: var(--accent); font-weight: 500; }

    /* ── Boarding-pass strip ────────────────────────────────────────────── */
    .bp-strip {
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      padding: 12px 0;
      border-top: 0.5px dashed var(--paper-line);
      border-bottom: 0.5px dashed var(--paper-line);
    }
    .bp-strip--dense { gap: 12px; padding: 10px 0; }
    .bp-strip__col { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .bp-strip__lbl {
      font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--ink-faint);
    }
    .bp-strip__val {
      font-family: var(--font-mono); font-size: 0.95rem; font-weight: 500;
      color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .bp-airline {
      color: var(--ac); font-weight: 700; margin-right: 2px;
    }

    /* ── Empty row ──────────────────────────────────────────────────────── */
    .empty-row {
      padding: 28px; text-align: center; color: var(--ink-faint);
      font-family: var(--font-serif); font-style: italic; font-size: 1.1rem;
      background: var(--paper-soft); border-radius: var(--radius);
      border: 0.5px dashed var(--paper-line);
    }

    /* ── CTA block ──────────────────────────────────────────────────────── */
    .cta {
      background: var(--ink); color: var(--paper);
      border-radius: 24px; padding: 32px 36px;
      box-shadow: var(--shadow-2);
    }
    .cta__inner {
      display: flex; justify-content: space-between; align-items: center; gap: 24px;
      flex-wrap: wrap;
    }
    .cta h3 {
      font-family: var(--font-serif); font-size: 2rem; font-weight: 400;
      letter-spacing: -0.01em; margin-bottom: 4px;
    }
    .cta p { margin: 0; color: color-mix(in oklab, var(--paper) 75%, transparent); max-width: 500px; }
    .cta__btn {
      appearance: none; border: 0; padding: 14px 22px; border-radius: 999px;
      background: var(--accent); color: white; font-weight: 600; font-size: 0.95rem;
    }
    .cta__btn:hover { background: color-mix(in oklab, var(--accent) 85%, white); }

    /* ── Modals ─────────────────────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 100;
      background: color-mix(in oklab, var(--ink) 50%, transparent);
      backdrop-filter: blur(6px);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 48px 24px; overflow-y: auto;
      animation: backdropIn .25s ease;
    }
    @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--paper); color: var(--ink);
      border-radius: 24px; max-width: 920px; width: 100%;
      box-shadow: 0 40px 80px -20px rgba(0,0,0,.4);
      position: relative;
      animation: modalIn .35s cubic-bezier(.2,.7,.3,1);
    }
    .modal--md { max-width: 680px; }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .modal__close {
      position: absolute; top: 16px; right: 16px; z-index: 2;
      appearance: none; border: 0; background: var(--paper-soft); color: var(--ink);
      width: 36px; height: 36px; border-radius: 50%;
      font-size: 0.9rem; font-weight: 500;
    }
    .modal__close:hover { background: var(--paper-deeper); }

    /* ── Flight Detail modal ────────────────────────────────────────────── */
    .fd { display: flex; flex-direction: column; }
    .fd__hero { padding: 32px 36px 12px; border-radius: 24px 24px 0 0; position: relative; overflow: hidden; }
    .fd__hero--airborne {
      background: linear-gradient(135deg, color-mix(in oklab, var(--sky) 14%, var(--paper)), var(--paper));
    }
    .fd__hero--boarding {
      background: linear-gradient(135deg, color-mix(in oklab, var(--warn) 16%, var(--paper)), var(--paper));
    }
    .fd__hero--scheduled { background: var(--paper); }
    .fd__hero--landed {
      background: linear-gradient(135deg, color-mix(in oklab, var(--sage) 14%, var(--paper)), var(--paper));
    }
    .fd__statusrow {
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .fd__id {
      font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-soft);
    }
    .fd__id-sep { margin: 0 8px; color: var(--ink-faint); }
    .fd__title {
      font-family: var(--font-serif); font-weight: 400; font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1; letter-spacing: -0.015em;
      display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    }
    .fd__city { display: flex; flex-direction: column; align-items: flex-start; }
    .fd__city-name { line-height: 1; }
    .fd__city-code {
      font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-faint);
      letter-spacing: 0.12em; margin-top: 6px;
    }
    .fd__arrow { color: var(--accent); }
    .fd__map { margin-top: 20px; border-radius: 16px; overflow: hidden; background: var(--paper); }
    .fd__map .route-map { width: 100%; aspect-ratio: 7/2.4; }

    .fd__statusdetail { padding: 28px 36px; border-bottom: 0.5px solid var(--paper-line); }
    .fd__stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 18px; margin-top: 18px;
    }
    .stat { display: flex; flex-direction: column; gap: 2px; }
    .stat__lbl { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-faint); }
    .stat__val { font-family: var(--font-serif); font-size: 1.6rem; letter-spacing: -0.01em; }

    .fd__landed { display: flex; align-items: center; gap: 16px; }
    .fd__landed-mark {
      width: 56px; height: 56px; border-radius: 50%; background: var(--sage); color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; font-weight: 600;
    }
    .fd__landed-title { font-family: var(--font-serif); font-size: 1.8rem; letter-spacing: -0.01em; }
    .fd__landed-sub { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-soft); }

    .fd__note {
      padding: 28px 36px; background: var(--paper-soft);
      border-bottom: 0.5px solid var(--paper-line);
    }
    .fd__note-kicker {
      font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--accent);
    }
    .fd__note p {
      font-family: var(--font-serif); font-style: italic; font-size: 1.5rem;
      line-height: 1.3; margin: 6px 0 0; color: var(--ink);
      text-wrap: balance;
    }
    .fd__details { padding: 24px 36px; border-bottom: 0.5px solid var(--paper-line); }
    .fd__details:last-child { border-bottom: 0; border-radius: 0 0 24px 24px; }
    .fd__h {
      font-family: var(--font-serif); font-weight: 400; font-size: 1.4rem;
      letter-spacing: -0.01em; margin-bottom: 14px;
    }
    .fd__grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px; margin-top: 14px;
    }
    .detail-field { display: flex; flex-direction: column; gap: 3px; }
    .detail-field__lbl {
      font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--ink-faint);
    }
    .detail-field__val { font-size: 1rem; font-weight: 500; color: var(--ink); }
    .detail-field__val--mono { font-family: var(--font-mono); }

    .fd__travelers { display: flex; flex-wrap: wrap; gap: 18px; }
    .fd__traveler { display: flex; align-items: center; gap: 12px; }
    .fd__traveler-name { font-family: var(--font-serif); font-size: 1.2rem; }
    .fd__traveler-role { font-size: 0.78rem; color: var(--ink-faint); }

    .fd__details--reactions { background: var(--paper-soft); border-radius: 0 0 24px 24px; }
    .fd__reactions { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
    .reaction { display: flex; gap: 12px; align-items: flex-start; }
    .reaction__name { font-weight: 600; margin-right: 8px; }
    .reaction__txt { color: var(--ink-soft); font-family: var(--font-serif); font-style: italic; font-size: 1.05rem; }
    .fd__react-input { display: flex; gap: 8px; }
    .fd__react-input input {
      flex: 1; padding: 12px 16px; border-radius: 999px; border: 0.5px solid var(--paper-line);
      background: var(--paper); font: inherit; color: inherit;
    }
    .fd__react-input button {
      appearance: none; border: 0; padding: 12px 20px; border-radius: 999px;
      background: var(--ink); color: var(--paper); font-weight: 600;
    }

    /* ── AddTrip modal ──────────────────────────────────────────────────── */
    .at { padding: 32px 36px; }
    .at__head { margin-bottom: 24px; }
    .at__kicker {
      font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--accent);
    }
    .at__title { font-family: var(--font-serif); font-size: 2.4rem; font-weight: 400; letter-spacing: -0.02em; margin-top: 4px; }
    .at__sub { color: var(--ink-soft); margin: 6px 0 0; }
    .at__tabs {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
      padding: 4px; background: var(--paper-soft); border-radius: 14px;
      margin-bottom: 24px;
    }
    .at__tabs button {
      appearance: none; border: 0; background: transparent;
      padding: 12px 14px; border-radius: 10px; text-align: left;
      display: flex; flex-direction: column; gap: 4px;
      color: var(--ink-soft); cursor: pointer;
      transition: background .15s, color .15s;
    }
    .at__tabs button.on { background: var(--ink); color: var(--paper); }
    .at__tabs button:hover:not(.on) { background: var(--paper-deeper); }
    .at__tab-num { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.1em; opacity: 0.7; }
    .at__tab-lbl { font-weight: 500; font-size: 0.9rem; }

    .at__body { display: flex; flex-direction: column; gap: 16px; }
    .at__row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .at__row:has(> .at__field--narrow) { grid-template-columns: 1fr auto auto; }
    @media (max-width: 600px) {
      .at__row { grid-template-columns: 1fr; }
    }
    .at__field { display: flex; flex-direction: column; gap: 6px; }
    .at__field > span {
      font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--ink-faint);
    }
    .at__field--full { grid-column: 1 / -1; }
    .at__field--narrow input { width: 110px; }
    .at__field input, .at__field select, .at__field textarea {
      width: 100%; padding: 10px 14px; border: 0.5px solid var(--paper-line);
      border-radius: 10px; background: var(--paper-soft);
      font: inherit; color: var(--ink); resize: vertical;
    }
    .at__field input:focus, .at__field select:focus, .at__field textarea:focus {
      outline: none; border-color: var(--ink); background: var(--paper);
    }
    .at__field textarea { font-family: var(--font-mono); font-size: 0.85rem; line-height: 1.5; }

    .at__people {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .at__person {
      appearance: none; border: 0.5px solid var(--paper-line);
      background: var(--paper-soft); padding: 4px 12px 4px 4px; border-radius: 999px;
      display: inline-flex; align-items: center; gap: 6px;
      font: inherit; font-size: 0.85rem; color: var(--ink-soft);
      transition: all .15s;
    }
    .at__person:hover { background: var(--paper-deeper); }
    .at__person.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

    .at__actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 12px; }
    .at__primary, .at__secondary {
      appearance: none; border: 0; padding: 12px 22px; border-radius: 999px;
      font-weight: 600; font: inherit; font-size: 0.95rem; cursor: pointer;
    }
    .at__primary { background: var(--accent); color: white; }
    .at__primary:hover { background: color-mix(in oklab, var(--accent) 85%, white); }
    .at__primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .at__secondary { background: transparent; color: var(--ink-soft); }
    .at__secondary:hover { color: var(--ink); }

    .at__drop {
      display: block;
      border: 1.5px dashed var(--paper-line); border-radius: 14px;
      padding: 48px 24px; text-align: center; cursor: pointer;
      background: var(--paper-soft); transition: background .2s, border-color .2s;
    }
    .at__drop:hover { background: var(--paper-deeper); border-color: var(--ink-faint); }
    .at__drop-icon { font-size: 2rem; margin-bottom: 10px; }
    .at__drop-title { font-family: var(--font-serif); font-size: 1.3rem; }
    .at__drop-sub { color: var(--ink-soft); font-size: 0.85rem; margin-top: 4px; }
    .at__drop-loading { color: var(--accent); margin-top: 14px; font-family: var(--font-mono); font-size: 0.85rem; }

    .at__parsed {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 14px 16px; border-radius: 12px;
      background: color-mix(in oklab, var(--sage) 15%, var(--paper-soft));
      font-size: 0.92rem;
    }
    .at__parsed-mark {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--sage); color: white;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 600; flex-shrink: 0;
    }
    .at__parsed--error { background: color-mix(in oklab, var(--warn) 18%, var(--paper-soft)); }
    .at__parsed--error .at__parsed-mark { background: var(--warn); color: var(--ink); }
    .at__parsed-note { margin-top: 6px; font-size: 0.85rem; color: var(--ink-soft); }
    .at__error {
      color: var(--warn); font-size: 0.85rem; text-align: right;
      margin-top: -6px;
    }

    /* ── Travelers view ─────────────────────────────────────────────────── */
    .travelers { display: flex; flex-direction: column; gap: 28px; }
    .travelers__grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
    .trav-card {
      appearance: none; border: 0; cursor: pointer; font: inherit; color: inherit;
      background: var(--paper-soft); border-radius: var(--radius); padding: 28px 20px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      text-align: center; box-shadow: var(--shadow-1);
      transition: transform .15s, box-shadow .15s;
      border: 0.5px solid var(--paper-line);
    }
    .trav-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
    .trav-card__name { font-family: var(--font-serif); font-size: 1.3rem; margin-top: 8px; letter-spacing: -0.01em; }
    .trav-card__nick { color: var(--accent); font-style: italic; }
    .trav-card__role { font-size: 0.82rem; color: var(--ink-soft); }
    .trav-card__home { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-faint); margin-top: 6px; }
    .trav-card__stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      width: 100%; margin-top: 14px; padding-top: 14px;
      border-top: 0.5px dashed var(--paper-line);
    }
    .trav-card__stats > div { display: flex; flex-direction: column; align-items: center; }
    .trav-card__stats strong { font-family: var(--font-serif); font-size: 1.4rem; letter-spacing: -0.01em; font-weight: 400; }
    .trav-card__stats span { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-faint); }
    .trav-card__stats > div[data-air="1"] strong { color: var(--sky); }

    /* ── Archive ────────────────────────────────────────────────────────── */
    .archive { display: flex; flex-direction: column; gap: 32px; }
    .arch-group { display: flex; flex-direction: column; }
    .arch-group__head {
      display: flex; align-items: center; gap: 16px; padding-bottom: 8px;
      margin-bottom: 4px;
    }
    .arch-group__when {
      font-family: var(--font-serif); font-size: 1.6rem; letter-spacing: -0.01em;
    }
    .arch-group__line { flex: 1; height: 0.5px; background: var(--paper-line); }
    .arch-group__count {
      font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-faint);
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .arch-row {
      appearance: none; border: 0; cursor: pointer; font: inherit; color: inherit;
      background: transparent; padding: 14px 12px; border-radius: 10px;
      display: grid;
      grid-template-columns: 80px auto 90px 1fr 70px 1.4fr;
      gap: 18px; align-items: center; text-align: left;
      transition: background .15s;
      border-bottom: 0.5px solid var(--paper-line);
    }
    .arch-row:last-child { border-bottom: 0; }
    .arch-row:hover { background: var(--paper-soft); }
    .arch-row__date { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-soft); }
    .arch-row__route { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 0.95rem; font-weight: 500; }
    .arch-row__arrow { color: var(--ink-faint); }
    .arch-row__cities { font-size: 0.9rem; color: var(--ink-soft); }
    .arch-row__flight { font-family: var(--font-mono); font-size: 0.85rem; }
    .arch-row__note { font-family: var(--font-serif); font-style: italic; color: var(--ink-faint); font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 900px) {
      .arch-row { grid-template-columns: 80px auto 1fr; }
      .arch-row__cities, .arch-row__flight, .arch-row__note { display: none; }
    }

    /* ── Password gate (temporary, pre-auth) ──────────────────────────────── */
    .gate {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      background: var(--paper); padding: 24px;
    }
    .gate__card {
      width: 100%; max-width: 360px;
      background: var(--paper-soft); border: 0.5px solid var(--paper-line);
      border-radius: 20px; padding: 36px 32px;
      box-shadow: var(--shadow-2);
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .gate__card .brand-mark { width: 52px; height: 52px; margin-bottom: 12px; }
    .gate__title { font-family: var(--font-serif); font-size: 1.6rem; letter-spacing: -0.01em; }
    .gate__sub { color: var(--ink-soft); font-size: 0.9rem; margin: 6px 0 22px; }
    .gate__input {
      width: 100%; padding: 12px 16px; border-radius: 999px;
      border: 0.5px solid var(--paper-line); background: var(--paper);
      font: inherit; font-size: 1rem; color: var(--ink); text-align: center;
      letter-spacing: 0.05em;
    }
    .gate__input:focus { outline: none; border-color: var(--ink); }
    .gate__error { color: var(--warn); font-size: 0.82rem; margin-top: 10px; }
    .gate__btn {
      margin-top: 16px; width: 100%; appearance: none; border: 0;
      padding: 12px 22px; border-radius: 999px;
      background: var(--accent); color: white; font-weight: 600; font-size: 0.95rem; cursor: pointer;
    }
    .gate__btn:hover { background: color-mix(in oklab, var(--accent) 85%, white); }

    /* ── Footer ─────────────────────────────────────────────────────────── */
    .footer {
      background: var(--ink); color: color-mix(in oklab, var(--paper) 85%, transparent);
      padding: 48px 36px 24px; margin-top: 80px;
    }
    .footer__inner { display: grid; grid-template-columns: 1fr 1.6fr; gap: 36px; max-width: 1200px; }
    @media (max-width: 800px) { .footer__inner { grid-template-columns: 1fr; } }
    .footer__brand { display: flex; gap: 14px; align-items: center; }
    .footer__brand .brand-mark { width: 44px; height: 44px; }
    .footer__title { font-family: var(--font-serif); font-size: 1.4rem; color: var(--paper); }
    .footer__sub { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.08em; opacity: 0.6; }
    .footer__cols { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    @media (max-width: 600px) { .footer__cols { grid-template-columns: 1fr; } }
    .footer__col-h { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
    .footer ul { padding-left: 18px; margin: 0; }
    .footer ul li { margin: 4px 0; }
    .footer__copy {
      text-align: center; padding-top: 32px; margin-top: 32px;
      border-top: 0.5px solid rgba(255,255,255,0.08);
      font-family: var(--font-mono); font-size: 0.7rem; opacity: 0.5;
    }

    /* ── HeroDeck (multi-flight) ──────────────────────────────────────── */
    .hero-deck {
      background: var(--paper-soft);
      border: 0.5px solid var(--paper-line);
      border-radius: 24px;
      padding: 28px 32px;
      box-shadow: var(--shadow-2);
    }
    .hero-deck__head {
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
    }
    .hero-deck__grid {
      display: grid; gap: 20px;
    }
    .hero-deck__grid--2 { grid-template-columns: 1fr 1fr; }
    .hero-deck__grid--3 { grid-template-columns: repeat(3, 1fr); }
    @media (max-width: 1100px) {
      .hero-deck__grid--2, .hero-deck__grid--3 { grid-template-columns: 1fr; }
    }
    .htile {
      cursor: pointer; appearance: none; text-align: left; font: inherit; color: inherit;
      background: var(--paper); border: 0.5px solid var(--paper-line);
      border-radius: 18px; padding: 0; overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: var(--shadow-1);
      transition: transform .15s, box-shadow .15s, border-color .15s;
    }
    .htile:hover {
      transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: var(--ink-faint);
    }
    .htile__map { position: relative; }
    .htile__map .route-map { width: 100%; height: 180px; display: block; }
    .htile__chip {
      position: absolute; top: 12px; left: 12px;
      font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 4px 10px; border-radius: 999px;
      background: var(--sky); color: white;
    }
    .htile__body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; }
    .htile__top { display: flex; justify-content: space-between; align-items: center; }
    .htile__id { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-soft); font-weight: 600; }
    .htile__headline {
      font-family: var(--font-serif); font-weight: 400; font-size: clamp(1.6rem, 2.6vw, 2.4rem);
      line-height: 1.05; letter-spacing: -0.015em; margin: 4px 0 0;
    }
    .htile__name { font-style: italic; color: var(--accent); }
    .htile__route {
      font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-soft);
      letter-spacing: 0.02em;
    }
    .htile__arrow { color: var(--accent); margin: 0 4px; }
    .htile__lines {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      padding-top: 12px; border-top: 0.5px solid var(--paper-line);
    }
    .htile__lines .hero__line-val { font-size: 1.3rem; }

    /* ── Trips home ────────────────────────────────────────────────────── */
    .trips-home { display: flex; flex-direction: column; gap: 48px; }
    .board-secondary { margin-top: 8px; display: flex; flex-direction: column; gap: 20px; }
    .board-secondary .board { gap: 40px; }

    .tcard-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: var(--gap-card);
    }
    .tcard-grid--compact { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }

    .tcard {
      background: var(--paper-soft); border: 0.5px solid var(--paper-line);
      border-radius: 18px; overflow: hidden; display: flex; flex-direction: column;
      box-shadow: var(--shadow-1);
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s;
    }
    .tcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: var(--ink-faint); }
    .tcard__map .route-map { width: 100%; height: 160px; display: block; }
    .tcard--compact .tcard__map .route-map { height: 120px; }
    .tcard__body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
    .tcard__top { display: flex; justify-content: space-between; align-items: center; }
    .tcard__headline {
      font-family: var(--font-serif); font-weight: 400; font-size: 1.5rem;
      line-height: 1.2; letter-spacing: -0.01em; margin: 0; text-wrap: balance;
    }
    .tcard--compact .tcard__headline { font-size: 1.25rem; }
    .tcard__meta { display: flex; flex-direction: column; gap: 2px; }
    .tcard__meta > span:first-child { font-size: 0.85rem; color: var(--ink-soft); }
    .tcard__sub { font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-faint); }
    .tcard__note {
      font-family: var(--font-serif); font-style: italic; color: var(--ink-soft);
      font-size: 0.92rem; line-height: 1.4;
      padding-top: 10px; border-top: 0.5px dashed var(--paper-line);
    }
    .tcard__flights { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
    .tcard__flightrow {
      appearance: none; border: 0.5px solid var(--paper-line); cursor: pointer;
      background: var(--paper); border-radius: 8px; padding: 8px 12px;
      display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
      font: inherit; color: inherit; text-align: left;
      transition: background .15s;
    }
    .tcard__flightrow:hover { background: var(--paper-deeper); }
    .tcard__flightrow-lbl {
      font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--ink-faint);
    }
    .tcard__flightrow-flight { font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600; }
    .tcard__flightrow-date { font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-soft); text-align: right; }
    .tcard__flightrow--empty {
      cursor: default; color: var(--ink-faint); font-style: italic;
      font-family: var(--font-serif); font-size: 0.9rem; justify-content: center;
      display: flex; padding: 8px 12px;
    }

    .homeroster { display: flex; flex-wrap: wrap; gap: 10px; }
    .hr-chip {
      display: flex; align-items: center; gap: 10px;
      background: var(--paper-soft); border: 0.5px solid var(--paper-line);
      border-radius: 999px; padding: 6px 16px 6px 6px;
    }
    .hr-chip__name { font-weight: 600; font-size: 0.9rem; }
    .hr-chip__status { font-family: var(--font-mono); font-size: 0.68rem; color: var(--ink-faint); letter-spacing: 0.03em; }

    /* ── Calendar (agenda) ─────────────────────────────────────────────── */
    .cal { display: flex; flex-direction: column; gap: 28px; max-width: 880px; }
    .cal__head {
      display: flex; justify-content: space-between; align-items: flex-end; gap: 24px;
      flex-wrap: wrap;
    }
    .cal__nav { display: flex; align-items: center; gap: 8px; }
    .cal__nav-btn {
      appearance: none; border: 0.5px solid var(--paper-line);
      background: var(--paper-soft); color: var(--ink);
      width: 38px; height: 38px; border-radius: 50%;
      font-size: 1.2rem; font-family: var(--font-serif);
    }
    .cal__nav-btn:hover { background: var(--paper-deeper); }
    .cal__nav-label {
      font-family: var(--font-serif); font-size: 1.5rem; min-width: 200px; text-align: center;
      letter-spacing: -0.01em;
    }
    .cal__today {
      appearance: none; border: 0.5px solid var(--ink); background: transparent;
      color: var(--ink); font: inherit; font-size: 0.8rem; font-weight: 500;
      padding: 8px 14px; border-radius: 999px; margin-left: 8px;
    }
    .cal__today:hover { background: var(--ink); color: var(--paper); }

    .cal__agenda {
      display: flex; flex-direction: column;
      border-top: 0.5px solid var(--paper-line);
    }
    .cal__quiet {
      padding: 60px 24px; text-align: center;
      font-family: var(--font-serif); font-style: italic; font-size: 1.3rem;
      color: var(--ink-faint);
    }

    /* ── DayRow ──────────────────────────────────────────────────────── */
    .dayrow {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 24px;
      padding: 22px 4px;
      border-bottom: 0.5px solid var(--paper-line);
      align-items: flex-start;
    }
    .dayrow--past { opacity: 0.55; }
    .dayrow--today {
      background:
        linear-gradient(90deg, color-mix(in oklab, var(--accent) 10%, transparent), transparent 60%);
      margin: 0 -16px; padding-left: 20px; padding-right: 20px; border-radius: 8px;
    }
    .dayrow__when {
      display: flex; flex-direction: column; gap: 2px;
      position: sticky; top: 100px; /* under topbar */
    }
    .dayrow__weekday {
      font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ink-faint);
    }
    .dayrow__date {
      font-family: var(--font-serif); font-size: 1.7rem; letter-spacing: -0.01em;
      line-height: 1.1;
    }
    .dayrow--today .dayrow__date { color: var(--accent); }
    .dayrow__pin {
      font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--accent); margin-top: 4px;
      font-weight: 600;
    }
    .dayrow__events { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }

    /* ── Lines ──────────────────────────────────────────────────────── */
    .dline {
      appearance: none; border: 0; background: transparent; color: inherit;
      font: inherit; text-align: left; cursor: default;
      display: flex; align-items: baseline; gap: 14px;
      padding: 4px 0;
      font-size: 1.18rem;
      line-height: 1.4;
    }
    .dline.dline--travel, .dline.dline--home { cursor: pointer; }
    .dline.dline--travel:hover, .dline.dline--home:hover { color: var(--accent); }
    .dline__icon {
      font-family: var(--font-serif); font-size: 1.3rem; color: var(--ink-faint);
      width: 22px; text-align: center; flex-shrink: 0;
    }
    .dline--travel .dline__icon { color: var(--accent); transform: rotate(-15deg); }
    .dline--home .dline__icon { color: var(--sage); }
    .dline--stay .dline__icon { color: var(--ink-faint); font-size: 1rem; line-height: 1.4; }
    .dline__text { display: inline; }
    .dline__name { font-family: var(--font-serif); font-style: italic; color: var(--ink); font-weight: 500; }
    .dline__verb { color: var(--ink-soft); }
    .dline__place { font-family: var(--font-serif); color: var(--ink); }
    .dline__meta { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-faint); letter-spacing: 0.02em; }

    @media (max-width: 720px) {
      .dayrow { grid-template-columns: 1fr; gap: 8px; padding: 18px 4px; }
      .dayrow__when { position: static; flex-direction: row; align-items: baseline; gap: 10px; }
      .dayrow__date { font-size: 1.4rem; }
      .dline { font-size: 1.05rem; gap: 10px; }
    }

    /* ── Now panel (the glance view) ─────────────────────────────────────── */
    .now { border: 1px solid var(--paper-line); background: var(--paper-soft); border-radius: 14px; overflow: hidden; }
    .now__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 18px 12px; border-bottom: 1px solid var(--paper-line); }
    .now__title { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
    .now__live { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); }
    .now__live[data-on="1"] { background: var(--accent); box-shadow: 0 0 0 0 color-mix(in oklch, var(--accent), transparent 40%); animation: nowpulse 2s infinite; }
    @keyframes nowpulse { 70% { box-shadow: 0 0 0 8px transparent } 100% { box-shadow: 0 0 0 0 transparent } }
    .now__tally { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-faint); letter-spacing: 0.02em; text-align: right; }
    .now__quiet { padding: 26px 18px; font-family: var(--font-serif); font-style: italic; color: var(--ink-soft); }
    .now__list { list-style: none; margin: 0; padding: 0; }
    .nowrow { border-bottom: 1px solid var(--paper-line); position: relative; }
    .nowrow[data-air="1"] { background: color-mix(in oklch, var(--accent), transparent 94%); }
    .nowrow[data-soon="1"] .nowrow__val { color: var(--ink); }
    .nowrow[data-soon="1"] .nowrow__dot { background: var(--ink-faint); animation: none; }
    .nowrow__hit { width: 100%; background: none; border: 0; cursor: pointer; color: inherit; text-align: left; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 12px 18px; font: inherit; min-height: 60px; }
    .nowrow__hit:hover { background: color-mix(in oklch, var(--ink), transparent 96%); }
    .nowrow__text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .nowrow__name { font-weight: 600; font-size: calc(1.02rem * var(--font-scale)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nowrow__place { font-size: calc(0.9rem * var(--font-scale)); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nowrow__right { text-align: right; display: flex; flex-direction: column; gap: 2px; white-space: nowrap; }
    .nowrow__val { font-family: var(--font-mono); font-size: calc(0.95rem * var(--font-scale)); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; }
    .nowrow[data-air="1"] .nowrow__val { color: var(--accent); }
    .nowrow__dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: nowpulse 2s infinite; }
    .nowrow__sub { font-family: var(--font-mono); font-size: 0.68rem; color: var(--ink-faint); letter-spacing: 0.02em; }
    .nowrow__prog { display: block; height: 2px; background: var(--paper-line); }
    .nowrow__prog > span { display: block; height: 100%; background: var(--accent); }
    .nowrow__detail { padding: 0 18px 16px; display: flex; flex-direction: column; gap: 12px; }
    .nowrow__map { border: 1px solid var(--paper-line); border-radius: 10px; overflow: hidden; }
    .nowrow__legs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .nowrow__leg { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--paper); border: 1px solid var(--paper-line); border-radius: 8px; padding: 10px 12px; font-family: var(--font-mono); font-size: 0.76rem; color: var(--ink-soft); cursor: pointer; text-align: left; }
    .nowrow__leg strong { color: var(--ink); }
    .nowrow__leg:hover { border-color: var(--accent); }
    .nowrow__leg--empty { cursor: default; grid-template-columns: 1fr; color: var(--ink-faint); }
    .nowrow__note { font-family: var(--font-serif); font-style: italic; color: var(--ink-soft); font-size: 0.95rem; }
    .now__foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 12px 18px; }
    .now__home { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .now__home-txt { font-size: 0.85rem; color: var(--ink-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .now__next { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
    .now__next li { display: flex; gap: 8px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-soft); justify-content: flex-end; }
    .now__next-when { color: var(--accent); }
    .now__next-more button { background: none; border: 0; padding: 0; font: inherit; color: var(--ink-faint); cursor: pointer; text-decoration: underline; }

    @media (max-width: 720px) {
      .topbar { grid-template-columns: 1fr auto; padding: 12px 16px; position: sticky; top: 0; z-index: 30; background: var(--paper); backdrop-filter: none; -webkit-backdrop-filter: none; }
      .topbar__nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--paper); border-top: 1px solid var(--paper-line); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); overflow: visible; }
      .topbar__nav button { min-height: 46px; font-size: 0.72rem; }
      .topbar__right { gap: 8px; }
      .pfil__btn { min-height: 38px; padding: 0 11px; font-size: 0.8rem; }
      .pfil__menu { width: min(74vw, 260px); }
      .topbar__add { width: 38px; height: 38px; }
      .topbar__pulse { display: none; }
      .main { padding: 14px 14px 90px; }
      .board { gap: 34px; }
      .now { border-radius: 12px; }
      .now__head { padding: 11px 14px 10px; }
      .now__tally { font-size: 0.66rem; }
      .nowrow__hit { padding: 11px 14px; gap: 11px; min-height: 58px; }
      .nowrow__detail { padding: 0 14px 14px; }
      .nowrow__legs { grid-template-columns: 1fr; }
      .now__foot { flex-direction: column; align-items: stretch; gap: 10px; padding: 11px 14px; }
      .now__next li { justify-content: flex-start; }
      .pfilter { padding: 10px 14px; gap: 6px; }
      .hero { padding: 24px 22px; }
      .fd__hero, .fd__statusdetail, .fd__note, .fd__details { padding-left: 22px; padding-right: 22px; }
      .at { padding: 24px 22px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- data first (plain JS) -->
  <script src="data.js"></script>
  <script src="supabase-client.js"></script>
  <!-- tweaks panel (depends on React) -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <!-- domain components -->
  <script type="text/babel" src="map.jsx"></script>
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="modals.jsx"></script>
  <script type="text/babel" src="calendar.jsx"></script>
  <script type="text/babel" src="trips.jsx"></script>
  <script type="text/babel" src="now.jsx"></script>
  <!-- app last -->
  <script type="text/babel" src="app.jsx" data-presets="env,react"></script>
</body>
</html>
